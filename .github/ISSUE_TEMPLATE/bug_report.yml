name: Bug report
description: Report a problem with the xuan runtime
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail
        as you can and search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A minimal script or steps to reproduce the issue.
      placeholder: |
        // repro.js
        ...
        // run: ./build/xuan run repro.js
      render: javascript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xuan version
      description: Output of `./build/xuan --version`.
      placeholder: v1.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - OpenWrt / embedded Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: x86_64 / arm64 / mipsel / riscv64
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Paste any error output here.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I built xuan from source or know the exact release version.
          required: false
